# Render blueprint for the FastAPI backend (frontend deploys on Vercel).
# Set ANTHROPIC_API_KEY and OPENAI_API_KEY in the Render dashboard.
services:
  - type: web
    name: patient-companion-api
    runtime: python
    plan: free
    buildCommand: pip install './backend' && python -m patient_companion.rag.ingest
    startCommand: uvicorn patient_companion.server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PC_CORS_ORIGINS
        value: '["https://your-frontend.vercel.app"]'
