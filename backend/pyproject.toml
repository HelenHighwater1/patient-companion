[project]
name = "patient-companion"
version = "0.1.0"
description = "Compassionate medical document translator with a grounded RAG pipeline (demo)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.39",
    "openai>=1.40",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7",
    "pypdf>=4.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]
fetch = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]
rerank = [
    "fastembed>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patient_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt strings are prose — wrapping them would hurt readability.
"src/patient_companion/agents/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["patient_companion"]
ignore_missing_imports = true
warn_unused_ignores = true
