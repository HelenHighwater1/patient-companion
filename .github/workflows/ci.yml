name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e '.[dev]'
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy
      - name: Pytest (mock providers, no API keys needed)
        run: uv run pytest

  eval-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e '.[dev]'
      - name: Retrieval eval on fixture corpus (mock providers)
        run: uv run python -m patient_companion.eval.run --mock
      - name: Assert refusal safety property
        run: |
          uv run python -c "import json; r=json.load(open('eval/results/latest.json')); assert r['refusal_accuracy']==1.0, r['refusal_accuracy']"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
